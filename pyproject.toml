[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-statement"
version = "0.1.0"
description = "Generate CRediT author-contribution statements from a contribution matrix."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
credit-statement = "credit_statement.cli:main"

[tool.setuptools]
packages = ["credit_statement"]
